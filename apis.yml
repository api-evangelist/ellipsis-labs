aid: ellipsis-labs
name: Ellipsis Labs
description: 'Ellipsis Labs builds decentralized finance applications and infrastructure
  on Solana. Its flagship product is Phoenix, a fully on-chain, atomically-settled
  limit order book exchange for spot assets, now expanded with Phoenix Perps for on-chain
  perpetual futures. The team also develops Atlas (a high-performance DeFi Layer 2),
  Gavel (token distribution and liquidity bootstrapping), and Plasma (a sandwich-resistant
  AMM reference implementation). Ellipsis exposes its protocol to developers through
  open-source SDKs (TypeScript, Rust, Python), command-line tools, and on-chain Solana
  programs rather than a hosted REST API. Backed by Electric Capital and Paradigm.'
